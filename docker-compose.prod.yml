# ==============================================================================
# CYBERGUARD — Production Docker Compose for EC2
# ==============================================================================
# Topology (single public entry point):
#
#   internet ──> nginx (frontend, port 80)
#                  ├── /            -> built React SPA
#                  ├── /api/*       -> api (FastAPI, internal)
#                  └── /healthz     -> api health
#
#   Everything else runs on the deployment's "localhost" only — reachable from
#   the EC2 box itself (ssh port-forward or curl) but NOT from the internet:
#     api        127.0.0.1:8000      postgres   127.0.0.1:5432
#     redis      127.0.0.1:6379      pgadmin    127.0.0.1:5050
#     redisinsight 127.0.0.1:5540
#
# Services:
#   1. postgres         -> PostgreSQL 16 relational database
#   2. redis            -> Redis 7 job broker (arq)
#   3. api              -> FastAPI SOAR backend + auto-migrations
#   4. gmail-worker     -> Arq worker: Gmail Pub/Sub sync & discovery
#   5. email-worker     -> Arq worker: MIME extraction, ML scoring & quarantine
#   6. scheduler-worker -> Arq worker: watch renewals & reconciliations
#   7. frontend         -> Nginx: SPA + /api reverse proxy (ONLY public port)
#   8. pgadmin          -> DB admin GUI (127.0.0.1:5050)
#   9. redisinsight     -> Redis queue visualizer (127.0.0.1:5540)
#
# Required .env file next to this compose file (see .env.example):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#
# Quickstart:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (localhost-only)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberguard-postgres-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Job Broker (localhost-only, password-protected)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberguard-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 3. FastAPI SOAR API Backend (proxied publicly via frontend nginx /api/*)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-api-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 4. Gmail Ingestion & Sync Worker
  # ----------------------------------------------------------------------------
  gmail-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-gmail-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    command: python -m arq app.workers.gmail_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 5. Email Forensics & ML Analysis Worker
  # ----------------------------------------------------------------------------
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-email-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    command: python -m arq app.workers.email_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 5b. Visual Phishing (Stage-2 Phishpedia) Worker
  #     Heavy CV (logo detection + Siamese matching) stays off the API process.
  #     Mounted model dir supplies the pretrained artifacts; see
  #     backend/app/services/phishpedia_engine/README.md.
  # ----------------------------------------------------------------------------
  visual-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-visual-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./ml-artifacts/phishpedia:/app/ml/data/phishpedia:ro
    command: python -m arq app.workers.visual_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 6. Periodic Scheduler & Watch Renewal Worker
  # ----------------------------------------------------------------------------
  scheduler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-scheduler-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    command: python -m arq app.workers.scheduler_worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 7. Frontend — Nginx: SPA at / + /api/* reverse proxy (the ONLY public port)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env}
    container_name: cyberguard-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 8. pgAdmin 4 (localhost-only; ssh tunnel to use: ssh -L 5050:localhost:5050)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cyberguard-pgadmin-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cyberguard.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-prod-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

  # ----------------------------------------------------------------------------
  # 9. RedisInsight (localhost-only; ssh tunnel to use: ssh -L 5540:localhost:5540)
  # ----------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: cyberguard-redisinsight-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-prod-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cyberguard-prod-net

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres-prod-data:
    name: cyberguard_prod_postgres_data
  redis-prod-data:
    name: cyberguard_prod_redis_data
  pgadmin-prod-data:
    name: cyberguard_prod_pgadmin_data
  redisinsight-prod-data:
    name: cyberguard_prod_redisinsight_data

networks:
  cyberguard-prod-net:
    name: cyberguard-prod-net
    driver: bridge
