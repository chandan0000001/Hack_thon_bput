[project]
name = "demo-server"
version = "0.1.0"
description = "Standalone CyberGuard project-gateway client: config, response store, shipper, CLI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
demo-server = "demo_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
