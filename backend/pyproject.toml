[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.20.0",
    "asyncpg>=0.29.0",
    "cryptography>=50.0.1",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.0",
    "supabase>=2.31.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arq>=0.25",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "frontend", "node_modules", ".venv", "ml", "storage"]
asyncio_mode = "auto"
addopts = "-v -ra --tb=short --strict-markers"
markers = [
  "scale: large-scale dataset evaluation tests",
  "online: requires network fetch (falls back to cache/synthetic)",
  "http: HTTP API tests via ASGI client",
  "media: image/audio media forensics tests",
  "slow: long-running tests",
]
